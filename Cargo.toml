[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Every external dependency is declared here with an exact version and used from
# the crates with `workspace = true`, so one place pins the whole app.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
almahrya-core = { path = "crates/core" }
almahrya-store = { path = "crates/store" }
almahrya-connectors = { path = "crates/connectors" }
almahrya-runtimes = { path = "crates/runtimes" }
almahrya-engine = { path = "crates/engine" }
almahrya-ui-kit = { path = "crates/ui-kit" }
almahrya-api-types = { path = "crates/api-types" }
almahrya-api = { path = "crates/api" }
almahrya-client = { path = "crates/client" }
almahrya-local = { path = "crates/local" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
time = { version = "=0.3.55", features = ["serde", "formatting"] }
ts-rs = "=12.0.1"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
thiserror = "=2.0.21"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-stream = "=0.3.6"
futures-core = "=0.3.34"
futures-util = "=0.3.34"
axum = { version = "=0.8.9", features = ["ws"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
subtle = "=2.6.1"
tokio-tungstenite = "=0.30.0"
fd-lock = "=4.0.4"
getrandom = "=0.3.4"
toml = "=1.2.1"
security-framework = "=3.7.0"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
url = "=2.5.8"
