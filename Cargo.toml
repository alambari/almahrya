[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Every external dependency is declared here with an exact version and used from
# the crates with `workspace = true`, so one place pins the whole app.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
almahrya-core = { path = "crates/core" }
almahrya-store = { path = "crates/store" }
almahrya-connectors = { path = "crates/connectors" }
almahrya-runtimes = { path = "crates/runtimes" }
almahrya-engine = { path = "crates/engine" }
almahrya-ui-kit = { path = "crates/ui-kit" }
almahrya-api-types = { path = "crates/api-types" }
almahrya-api = { path = "crates/api" }
almahrya-client = { path = "crates/client" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
time = { version = "=0.3.55", features = ["serde", "formatting"] }
ts-rs = "=12.0.1"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
